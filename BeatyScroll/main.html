<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      --main-color: #52616b ;
      --secondary-color: #c9d6df;
      --third-color: #1e2022;
    }

    html::-webkit-scrollbar {
    display: none; 
    }

    body {
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      text-align: center;
      justify-content: center;
      align-items: center;
      background-color: var(--main-color);
    }

    .anyInfo {
      margin: 100px 300px 700px 300px;
      font-family: monospace;
      font-weight: bold;
      font-size: 104px;
      color: var(--secondary-color);
    }
    
    .anyInfo2 {
      margin: 700px 300px 300px 300px;
      font-family: monospace;
      font-weight: bold;
      font-size: 104px;
      color: var(--secondary-color);
    }
    
    .scrollDiv{
      position: absolute;
      left: 45vw;
      display: flex;
      flex-direction: row;
      gap: 1000px;

    }

    .carPic{
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      object-fit: cover;
      width: 200px;
      height: 400px;
    }
  </style>
</head>

<body class="body">
  <p class="anyInfo">This is website for beatifull scroll</p>
  <div class="scrollDiv"></div>
  <p class="anyInfo2">End of website</p>
  <script src="index.js"></script>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      text-align: center;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #a4e5d9;
    }

    .square {
      display: grid;
      grid-template-columns: repeat(10, 40px);
      grid-template-rows: repeat(10, 40px);
      border: 3px solid #649dad;
      background-color: #62d3be;
    }

    .cell {
      width: 40px;
      height: 40px;
      border: 1px solid #649dad;
    }

    .squareH {
      height: 80vh;
      width: 80vh;
    }

    .squareV {
      height: 80vw;
      width: 80vw;
    }

    .snake {
      position: absolute;
      border-radius: 100%;
      height: 35px;
      width: 35px;
      background-color: #0e3150;
    }
    .snakeFrag {
      position: absolute;
      border-radius: 100%;
      height: 35px;
      width: 35px;
      background-color: #0e3150;
    }

    .gameover{
      position: absolute;
      top: 10vh;
      font-size: 20px;
      font-weight: bold;

    }
  </style>
</head>

<body>
  <div class="square" id="square"></div>
  <div class="snake" id="snake"></div>
  <script src="index.js"></script>
</body>

</html>

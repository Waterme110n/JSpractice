<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      text-align: center;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #ffe2e2;
    }

    .clock {
      display: block;
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 1000px;
      border: 10px solid black;
      background-color: #ffc7c7;
    }

    .centerCircle {
      display: block;
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 1000px;
      border: none;
      background-color: black;
      text-align: center;
      justify-content: center;
    }

    .bigSech{
      display: block;
      position: absolute;
      width: 10px;
      height: 40px;
      background-color: black;
    }

  </style>
</head>

<body class="body" >
  <div class="clock">

  </div>
  <script src="index.js"></script>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="path/to/your/icon.png">
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      text-align: center;
      justify-content: space-around;
      align-items: center;
      height: 100vh;
      background-color: #dbe2ef;
    }

    .pianino {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: row;
      text-align: center;
      justify-content: space-around;
      align-items: end;
      height: 40vh;
      width: 70vw;
      background-color: #dbe2ef;
    }

    .note {
      margin: 0;
      padding: 40px 50px;
      display: block;
      background-color: #3f72af;
      font-family:monospace;
      font-weight: bold;
      font-size: 24px;
      color: #dbe2ef;
      text-align: center;
      border-radius: 5px;
      width: auto;
      height: auto;
      box-shadow: 0px 20px 0px 20px #112d4e;
      transition: all 0.2s;
    }

    .note:hover {
      transform: translateY(2px);
      box-shadow: 0px 15px 0px 15px #112d4e;
    }
  </style>
</head>

<body class="body">
  <div class="pianino"></div>
  <script src="index.js"></script>
</body>

</html>

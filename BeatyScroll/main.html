<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      --main-color: #c9d6df;
      --secondary-color: #52616b;
      --third-color: #1e2022;
    }

    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      text-align: center;
      justify-content: center;
      align-items: center;
      background-color: var(--main-color);
    }

    .anyInfo {
      margin: 300px 300px;
      font-family: monospace;
      font-weight: bold;
      font-size: 104px;
      color: var(--secondary-color);
    }

    .carPic{
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      object-fit: cover;
      width: 200px;
      height: 400px;
    }
  </style>
</head>

<body class="body">
  <p class="anyInfo">This is website for beatifull scroll</p>
  <div class="scrollDiv"></div>
  <p class="anyInfo">End of website</p>
  <script src="index.js"></script>
</body>

</html>
